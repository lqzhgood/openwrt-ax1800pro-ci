#云编译公用核心
name: WRT-CORE

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: true
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        type: string

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_SOURCE: ${{inputs.WRT_SOURCE}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Projects
        uses: actions/checkout@main

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq purge firefox
          sudo -E apt -yqq update
          sudo -E apt -yqq full-upgrade
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E apt -yqq install dos2unix libfuse-dev
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Initialization Values
        run: |
          echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV
          echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}" >> $GITHUB_ENV
          echo "WRT_INFO=${WRT_SOURCE%%/*}" >> $GITHUB_ENV
          echo "WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' ./Config/$WRT_CONFIG.txt)" >> $GITHUB_ENV
          echo "WRT_WIFI=wifi-yes" >> $GITHUB_ENV
          echo "WRT_KVER=none" >> $GITHUB_ENV
          echo "WRT_LIST=none" >> $GITHUB_ENV

      - name: Clone Code
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/

          cd ./wrt/ && echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV

          # 记录上游真实版本标识（滚动版为 SNAPSHOT，锁 tag 时为版本号，如 25.12.1）
          echo "WRT_COMMIT=$(git log -1 --pretty=format:'%H')" >> $GITHUB_ENV
          echo "WRT_CDATE=$(git log -1 --pretty=format:'%ci')" >> $GITHUB_ENV
          echo "WRT_CLINK=${WRT_REPO%.git}/commit/$(git log -1 --pretty=format:'%H')" >> $GITHUB_ENV
          WRT_VERSION=$(grep -m1 '^VERSION_NUMBER:=' ./include/version.mk | grep -oE 'SNAPSHOT|[0-9]+\.[0-9]+(\.[0-9]+)?' | tail -1)
          echo "WRT_VERSION=${WRT_VERSION:-$WRT_BRANCH}" >> $GITHUB_ENV

          # GitHub Action 移除国内下载源
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

      - name: Upstream Version
        run: |
          set +eo pipefail   # 纯展示信息：API 异常只显示 unknown，绝不中断编译
          UP_REPO="immortalwrt/immortalwrt"
          UP_HEAD="${WRT_SOURCE%%/*}:${WRT_BRANCH}"

          # 求当前源码与官方 master 的共同基点 = 本次构建对应的上游真实 commit
          UP_JSON=$(curl -sL -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/$UP_REPO/compare/master...$UP_HEAD")
          UP_HASH=$(echo "$UP_JSON" | jq -r '.merge_base_commit.sha // empty')
          UP_DATE=$(echo "$UP_JSON" | jq -r '.merge_base_commit.commit.committer.date // empty')

          # 最近的上游正式发布 tag（取语义版本最大的 vX.Y.Z）
          UP_TAG=$(curl -sL -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/$UP_REPO/tags?per_page=100" | jq -r '[.[].name|select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))]|sort_by(ltrimstr("v")|split(".")|map(tonumber))|last // empty')

          # 当前基点相对该发布 tag 的领先/落后提交数、tag 日期、提交时间差（天）
          UP_DIFF=$(curl -sL -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/$UP_REPO/compare/$UP_TAG...$UP_HASH")
          UP_AHEAD=$(echo "$UP_DIFF" | jq -r '.ahead_by // empty')
          UP_BEHIND=$(echo "$UP_DIFF" | jq -r '.behind_by // empty')
          UP_TAGDATE=$(echo "$UP_DIFF" | jq -r '.base_commit.commit.committer.date // empty')
          UP_DAYS=unknown
          if [ -n "$UP_DATE" ] && [ -n "$UP_TAGDATE" ]; then
            T1=$(date -d "$UP_DATE" +%s 2>/dev/null)
            T2=$(date -d "$UP_TAGDATE" +%s 2>/dev/null)
            [ -n "$T1" ] && [ -n "$T2" ] && UP_DAYS=$(( (T1 - T2) / 86400 ))
          fi

          echo "WRT_UPHASH=${UP_HASH:-unknown}" >> $GITHUB_ENV
          echo "WRT_UPDATE=${UP_DATE:-unknown}" >> $GITHUB_ENV
          echo "WRT_UPTAG=${UP_TAG:-unknown}" >> $GITHUB_ENV
          echo "WRT_UPLINK=https://github.com/$UP_REPO/commit/${UP_HASH}" >> $GITHUB_ENV
          echo "WRT_UPTAGDATE=${UP_TAGDATE:-unknown}" >> $GITHUB_ENV
          echo "WRT_UPAHEAD=${UP_AHEAD:-unknown}" >> $GITHUB_ENV
          echo "WRT_UPBEHIND=${UP_BEHIND:-unknown}" >> $GITHUB_ENV
          echo "WRT_UPDAYS=${UP_DAYS}" >> $GITHUB_ENV

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Check Caches
        id: check-cache
        if: env.WRT_TEST != 'true'
        uses: actions/cache@main
        with:
          key: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_HASH}}
          restore-keys: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Update Caches
        if: env.WRT_TEST != 'true'
        run: |
          if [ -d "./wrt/staging_dir" ]; then
            find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
              find "$DIR" -type f -exec touch {} +
            done

            mkdir -p ./wrt/tmp && echo "1" > ./wrt/tmp/.build

            echo "toolchain skiped done!"
          else
            echo "caches missed!"
          fi

          if ${{steps.check-cache.outputs.cache-hit != 'true'}}; then
            CACHE_LIST=$(gh cache list --key "$WRT_CONFIG-$WRT_INFO" | cut -f 1)
            for CACHE_KEY in $CACHE_LIST; do
              gh cache delete $CACHE_KEY
            done

            echo "caches cleanup done!"
          fi

      - name: Update Feeds
        run: |
          cd ./wrt/

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Packages
        run: |
          cd ./wrt/package/

          $GITHUB_WORKSPACE/Scripts/Packages.sh
          $GITHUB_WORKSPACE/Scripts/Handles.sh

      - name: Custom Settings
        run: |
          cd ./wrt/

          if [[ "${WRT_CONFIG,,}" == *"test"* ]]; then
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt >> .config
          else
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt $GITHUB_WORKSPACE/Config/GENERAL.txt >> .config
          fi

          $GITHUB_WORKSPACE/Scripts/Settings.sh

          make defconfig -j$(nproc) && make clean -j$(nproc)

      - name: Download Packages
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          make download -j$(nproc)

      - name: Compile Firmware
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          make -j$(nproc) || make -j1 V=s

      - name: Machine Information
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir ./upload/

          cp -f ./.config ./upload/Config-"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt

          if [[ $WRT_TEST != 'true' ]]; then
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" >> $GITHUB_ENV
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV

            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} +

            for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TARGET*") ; do
              EXT=$(basename $FILE | cut -d '.' -f 2-)
              NAME=$(basename $FILE | cut -d '.' -f 1 | grep -io "\($WRT_TARGET\).*")
              NEW_FILE="$NAME"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_WIFI"-"$WRT_DATE"."$EXT"
              mv -f $FILE ./upload/$NEW_FILE
            done

            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;

            make clean -j$(nproc)
          fi

      - name: Release Firmware
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-${{env.WRT_DATE}}
          files: ./wrt/upload/*.*
          body: |
            这是个平台固件包，内含多个设备！
            请注意选择你需要的设备固件！
            不要问，刷就完事了！

            全系带开源硬件加速，别问了！

            源码：${{env.WRT_REPO}}
            分支：${{env.WRT_BRANCH}}
            版本：${{env.WRT_VERSION}}
            构建提交：${{env.WRT_COMMIT}}
            构建时间：${{env.WRT_CDATE}}
            构建快照：${{env.WRT_CLINK}}

            上游源码：https://github.com/immortalwrt/immortalwrt
            上游提交：${{env.WRT_UPHASH}}
            上游时间：${{env.WRT_UPDATE}}
            上游快照：${{env.WRT_UPLINK}}
            上游最新发布：${{env.WRT_UPTAG}}（${{env.WRT_UPTAGDATE}}）
            相对发布：领先 ${{env.WRT_UPAHEAD}} / 落后 ${{env.WRT_UPBEHIND}} 提交，基点比发布新 ${{env.WRT_UPDAYS}} 天

            配置：${{env.WRT_CONFIG}}
            平台：${{env.WRT_TARGET}}

            登录地址：${{env.WRT_IP}}
            登录密码：${{env.WRT_PW}}

            WIFI名称：${{env.WRT_SSID}}
            WIFI密码：${{env.WRT_WORD}}

            内核版本：${{env.WRT_KVER}}
            插件列表：${{env.WRT_LIST}}
